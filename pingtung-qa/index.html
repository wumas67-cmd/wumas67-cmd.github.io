<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>屏東廠線上品保查核</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column clipboard of inspection sections, sticky score bar at the bottom; entered values in form "blue ink" like the paper sheet */
:root{
  --paper:#f3f5f7; --sheet:#ffffff; --line:#d5dbe1; --line-strong:#9aa6b2;
  --text:#18212b; --muted:#5b6876; --ink:#1f47b8; --ink-soft:#e7edfb;
  --pass:#13804a; --pass-soft:#e3f4ea; --fail:#c62a2a; --fail-soft:#fbe8e8; --warn:#9a6400; --warn-soft:#fbf1dc;
  --bar:#16202b; --bar-text:#f3f5f7;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f151b; --sheet:#17202a; --line:#2c3845; --line-strong:#4b5a6a;
  --text:#e6ebf0; --muted:#97a4b2; --ink:#86a8ff; --ink-soft:#1c2a4a;
  --pass:#4cc785; --pass-soft:#123122; --fail:#ff7a7a; --fail-soft:#3a1818; --warn:#e3b04f; --warn-soft:#33270f;
  --bar:#05090d; --bar-text:#e6ebf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151b; --sheet:#17202a; --line:#2c3845; --line-strong:#4b5a6a;
  --text:#e6ebf0; --muted:#97a4b2; --ink:#86a8ff; --ink-soft:#1c2a4a;
  --pass:#4cc785; --pass-soft:#123122; --fail:#ff7a7a; --fail-soft:#3a1818; --warn:#e3b04f; --warn-soft:#33270f;
  --bar:#05090d; --bar-text:#e6ebf0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{padding-top:20px;display:flex;flex-direction:column;gap:12px}
.formno{font-family:var(--f-num);font-size:12px;color:var(--muted);letter-spacing:.06em}
h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 9px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
input.num{font-family:var(--f-num);text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--text);padding:7px 12px}
button.primary{background:var(--ink);border-color:var(--ink);color:var(--sheet);font-weight:700}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.notice{font-size:13px;padding:8px 12px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
section.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card-h{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.stage{font-size:12px;font-weight:700;color:var(--muted);writing-mode:vertical-rl;letter-spacing:.2em;border-right:2px solid var(--line);padding-right:8px;min-height:40px;text-align:center}
.card-h h2{margin:0;font-size:16px;font-weight:700}
.card-h .rule{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:center;gap:8px;font-family:var(--f-num)}
.score b{font-size:18px}
.score small{color:var(--muted);font-size:12px}
.pill{font-family:var(--f-body);font-weight:900;font-size:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);color:var(--muted)}
.pill.O{border-color:var(--pass);color:var(--pass);background:var(--pass-soft)}
.pill.X{border-color:var(--fail);color:var(--fail);background:var(--fail-soft)}
.card-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;gap:8px;align-items:end;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0}
.row .idx{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
@media (max-width:560px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g3 .span3{grid-column:1/-1}}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;padding:8px 4px;background:var(--sheet);color:var(--muted);font-weight:700;min-width:0}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.ok{background:var(--pass-soft);color:var(--pass)}
.seg button.on.ng{background:var(--fail-soft);color:var(--fail)}
.seg button.on.neu{background:var(--ink-soft);color:var(--ink)}
.result{display:flex;align-items:center;gap:6px;min-height:38px}
.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--pass-soft);color:var(--pass)}
.tag.ng{background:var(--fail-soft);color:var(--fail)}
.tag.none{background:var(--paper);color:var(--muted);font-weight:500}
.tag.manual::after{content:" 手動";font-weight:500;font-size:11px}
.calc{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.calc b{color:var(--text)}
.std{font-size:12px;color:var(--muted)}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph{position:relative;width:76px;height:76px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:2px;right:2px;padding:0 6px;font-size:12px;line-height:18px;background:var(--sheet)}
.addph{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);border:1px dashed var(--ink);border-radius:6px;padding:8px 12px;cursor:pointer}
.addph input{display:none}
.addph svg{width:16px;height:16px}
.sub{font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.scan{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:8px;background:var(--ink-soft)}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 12px;border-radius:6px;background:var(--ink);color:var(--sheet);font-weight:700;cursor:pointer}
.scanbtn.busy{opacity:.7;cursor:progress}
.scanrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scanbtn.alt{background:var(--sheet);color:var(--ink);border:1px solid var(--ink)}
.scan.dragover{outline:2px dashed var(--ink);outline-offset:2px}
.scanbtn input{display:none}
.scanbtn svg{width:18px;height:18px}
.scanmsg{font-size:13px;color:var(--ink)}
.scanmsg.ok{color:var(--pass)} .scanmsg.ng{color:var(--fail)}
.aifill{background:var(--warn-soft)!important}
details.settings{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.settings summary{cursor:pointer;font-weight:700}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.setgrid textarea{min-height:120px;font-size:13px}
table.month{border-collapse:collapse;width:100%;font-family:var(--f-num);font-size:13px}
table.month td,table.month th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right}
table.month th:first-child,table.month td:first-child{text-align:left}
.tablewrap{overflow-x:auto}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);color:var(--bar-text);z-index:20;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.total{display:flex;align-items:baseline;gap:6px;font-family:var(--f-num)}
.total b{font-size:28px}
.total span{opacity:.75;font-size:13px}
.bar .grow{flex:1}
.bar .msg{font-size:12px;opacity:.8;flex-basis:100%;min-height:1em}
.bar button{border-color:#ffffff40;background:transparent;color:var(--bar-text)}
.bar button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
@media (prefers-reduced-motion:no-preference){.pill,.tag{transition:background .15s,color .15s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="formno">表單編號 Q-60 Rev.5</div>
    <h1>線上品保查核表（屏東飼料廠）</h1>
    <div class="meta">
      <label class="f">查核日期<input type="date" id="m-date"></label>
      <label class="f">開始時間<input type="time" id="m-t1"></label>
      <label class="f">結束時間<input type="time" id="m-t2"></label>
      <label class="f">製表<input id="m-maker" placeholder="填表人"></label>
      <label class="f">主管<input id="m-boss" placeholder="（可空白）"></label>
    </div>
    <div class="toolbar">
      <button id="btn-copy" type="button">沿用上一筆品項</button>
      <button id="btn-new" type="button">清空本表</button>
      <button id="btn-sample" type="button" class="ghost">載入範例</button>
    </div>
    <div id="sample-note" class="notice" hidden>目前顯示的是範例資料（取自 115/11/05 的查核表），請按「清空本表」開始填寫今天的資料。</div>
  </header>
  <div id="sections"></div>

  <details class="settings" id="month-box">
    <summary>本月指數</summary>
    <div class="tablewrap"><table class="month" id="month-table"></table></div>
    <p class="std" id="month-src"></p>
  </details>

  <details class="settings">
    <summary>設定（品項清單與判定標準）</summary>
    <div class="setgrid">
      <label class="f">進廠原料品項（一行一個）<textarea id="s-raw"></textarea></label>
      <label class="f">庫存原料品項<textarea id="s-stock"></textarea></label>
      <label class="f">預混料品項<textarea id="s-premix"></textarea></label>
      <label class="f">成品品名=桶位<textarea id="s-fg"></textarea></label>
      <label class="f">調質溫度標準（料別=下限~上限）<textarea id="s-feed"></textarea></label>
      <label class="f">其他標準
        <textarea id="s-misc"></textarea></label>
    </div>
    <div class="toolbar" style="margin-top:10px"><button type="button" id="btn-save-set">儲存設定</button><button type="button" id="btn-reset-set" class="ghost">還原預設</button></div>
  </details>

  <details class="settings" id="ai-box">
    <summary>AI 辨識設定（加藥單拍照）</summary>
    <p class="std" id="ai-mode"></p>
    <div class="setgrid">
      <label class="f">AI 服務<select id="ai-provider"><option value="gemini">Google Gemini</option><option value="claude">Anthropic Claude</option></select></label>
      <label class="f">API 金鑰<input id="ai-key" type="password" autocomplete="off" placeholder="貼上金鑰"></label>
      <label class="f">模型名稱<input id="ai-model" placeholder=""></label>
    </div>
    <p class="std">金鑰只存在這台裝置的瀏覽器裡，不會放進網頁原始碼或 Excel。Gemini 金鑰可到 Google AI Studio 申請；Claude 金鑰到 console.anthropic.com 申請。</p>
    <div class="toolbar"><button type="button" id="ai-save">儲存 AI 設定</button><button type="button" id="ai-clear" class="ghost">清除金鑰</button></div>
  </details>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="total"><b id="t-score">0.0</b><span>/ <span id="t-max">100</span> 分</span></div>
    <div class="grow"></div>
    <button type="button" id="btn-submit">存檔</button>
    <button type="button" id="btn-export" class="primary">輸出 Excel</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<datalist id="dl-raw"></datalist><datalist id="dl-stock"></datalist><datalist id="dl-premix"></datalist><datalist id="dl-fg"></datalist><datalist id="dl-feed"></datalist>

function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
let S = lsGet("qa-draft") || sampleState();
if(!S.photos) S.photos=[];

/* ---------- rules ---------- */
const num = v => (v===""||v==null||isNaN(+v)) ? null : +v;
function pairRes(a,b){ if(!a||!b) return ""; return (a==="合格"&&b==="合格")?"合格":"不合格"; }
function daysBetween(a,b){return Math.round((Date.parse(b)-Date.parse(a))/86400000)}
const calc = {
  raw: r => r.res || pairRes(r.nir,r.look),
  stock: r => r.res || pairRes(r.a,r.b),
  premixLimit: r => r.color==="有" ? SET.misc.colorDays : SET.misc.plainDays,
  premix: r => { if(r.res) return r.res; if(!r.mfg||!r.color) return ""; return daysBetween(r.mfg,S.date) <= calc.premixLimit(r) ? "合格":"不合格"; },
  coarse: c => { const a=num(c.p6),b=num(c.p610),d=num(c.p20); if(a==null&&b==null&&d==null) return "";
    if(a==null||b==null||d==null) return ""; return (a<=SET.misc.corn6 && b>=SET.misc.corn610 && d<=SET.misc.corn20)?"合格":"不合格"; },
  fine: c => { const a=num(c.p12); if(a==null) return ""; return a<=SET.misc.corn12?"合格":"不合格"; },
  range: r => SET.feed[r.feed] || null,
  cond: r => { const t=num(r.temp), rg=calc.range(r); if(t==null||!rg) return ""; return (t>=rg[0]&&t<=rg[1])?"合格":"不合格"; },
  dosePlan: d => (d.adds||[]).reduce((s,a)=>s+(num(a.kg)||0),0),
  dose: d => { const p=calc.dosePlan(d), a=num(d.actual); if(a==null||!p) return {res:"",err:null,ratio:null};
    const err=a-p, ratio=err/p; return {res: Math.abs(ratio)<=SET.misc.doseTol/100?"合格":"不合格", err, ratio}; },
  fg: r => r.res || ((r.nir&&r.prop) ? ((r.nir==="O"&&r.prop==="O")?"合格":"不合格") : ""),
};
function blockScore(C, results){
  const Y=results.filter(Boolean).length, X=results.filter(x=>x==="合格").length;
  const D = Y? (X===Y?"O":"X") : ""; const E = D? C*X/Y : null; return {X,Y,D,E,C};
}
function scoreAll(){
  const b = {};
  b.raw = blockScore(15, S.raw.map(calc.raw));
  b.stock = blockScore(5, S.stock.map(calc.stock));
  b.premix = blockScore(20, S.premix.map(calc.premix));
  b.corn = blockScore(5, [calc.coarse(S.corn), calc.fine(S.corn)]);
  b.cond = S.cond.map(r=>blockScore(2.5,[calc.cond(r)]));
  b.dose = S.dose.map(d=>{const r=calc.dose(d); const D=r.res?(r.res==="合格"?"O":"X"):""; return {D,E:D?(D==="O"?10:0):null,C:10,...r};});
  b.fg = blockScore(20, S.fg.map(calc.fg));
  b.other = blockScore(5, S.other.map(o=>o.ok?"合格":"不合格"));
  const all=[b.raw,b.stock,b.premix,b.corn,...b.cond,...b.dose,b.fg,b.other];
  const total = all.reduce((s,x)=>s+(x.E||0),0);
  const max = all.reduce((s,x)=>s+x.C,0);
  const unfilled = all.filter(x=>!x.D).length;
  return {b,total,max,unfilled};
}

/* ---------- render ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v,d=1) => v==null?"—":(+v).toFixed(d);
function seg(path, opts, val){
  return `<div class="seg" role="group">${opts.map(([v,cls,label])=>`<button type="button" class="${val===v?"on "+cls:""}" data-set="${path}" data-val="${esc(v)}" aria-pressed="${val===v}">${label||v}</button>`).join("")}</div>`;
}
const PASSFAIL=[["合格","ok"],["不合格","ng"]], OX=[["O","ok","O"],["X","ng","X"]];
function inp(path, val, attrs=""){
  if(AI_FILLED.has(path)) attrs = attrs.includes('class="') ? attrs.replace('class="','class="aifill ') : attrs+' class="aifill"';
  return `<input data-in="${path}" value="${esc(val)}" ${attrs}>`}
function resultTag(res, manual, path){
  const cls = res==="合格"?"ok":res==="不合格"?"ng":"none";
  return `<div class="result"><span class="tag ${cls} ${manual?"manual":""}">${res||"待判定"}</span>${path?`<button type="button" class="ghost" data-override="${path}" title="手動改判定">改判</button>`:""}</div>`;
}
function card(id, stage, title, rule, sc, body){
  return `<section class="card" id="sec-${id}"><div class="card-h"><div class="stage">${stage}</div><div><h2>${title}</h2><div class="rule">${rule}</div></div>
  <div class="score"><span class="pill ${sc.D}">${sc.D||"–"}</span><b>${sc.E==null?"—":fmt(sc.E)}</b><small>/${sc.C}</small></div></div>
  <div class="card-b">${body}${photoBlock(id)}</div></section>`;
}
function photoBlock(id){
  const ps=S.photos.filter(p=>p.sec===id);
  return `<div class="photos">${ps.map(p=>`<div class="ph"><img src="${p.data}" alt="${esc(p.cap)}"><button type="button" data-delph="${p.id}" aria-label="刪除照片">×</button></div>`).join("")}
  <label class="addph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>拍照佐證<input type="file" accept="image/*" capture="environment" multiple data-photo="${id}"></label></div>`;
}
function render(){
  const {b,total,max,unfilled} = scoreAll();
  const h=[];
  // raw
  h.push(card("raw","原料","進廠原料（NIR 掃描成份）","檢查外觀、氣味、NIR 成分（水分、粗蛋白、粗脂肪）",b.raw,
    S.raw.map((r,i)=>`<div class="row g4"><label class="f span2">品項 ${i+1}<input data-in="raw.${i}.name" value="${esc(r.name)}" list="dl-raw"></label>

const AI_BUSY={}, AI_MSG={}, AI_FILLED=new Set();
const AI_DEFAULT_MODEL={gemini:"gemini-3.8-flash", claude:"claude-sonnet-5-5"};
let AI=Object.assign({provider:"gemini",key:"",model:""}, lsGet("qa-ai")||{});
let SAMPLE=null;
function aiPrompt(){
  return `這是一張飼料廠生產課的「加藥單／手投藥品單」照片（可能是手寫或列印）。請讀出：
- prod：飼料品名（例如 紅仿三期、高前、契約仔豬）
- cust：客戶名稱或客戶姓名
- tons：生產噸數（數字，單位噸）
- adds：要手投添加的藥品或原料清單，每項 {name, kg}；kg 為這一批的添加重量，單位公斤。若單據寫公克(g)請換算成公斤；若只寫每噸用量，請乘上噸數換算成這一批的總重。
- note：無法確定或看不清楚的地方，用一句繁體中文說明；都清楚就給空字串。
看不到的欄位給 null，不要猜。藥品名照單據原文抄寫。
參考：本廠常見品名有 ${Object.keys(SET.fg).slice(0,40).join("、")}。
只回傳 JSON，格式：{"prod":string|null,"cust":string|null,"tons":number|null,"adds":[{"name":string,"kg":number|null}],"note":string}`;
}
function parseJSON(t){ const m=String(t).match(/\{[\s\S]*\}/); if(!m) throw new Error("AI 沒有回傳可讀的結果"); return JSON.parse(m[0]); }
/* Busy (503/529/overloaded) → wait and retry, then fall back to the next model.
   Quota used up (429) → go straight to the next model. Other errors stop. */
const GEMINI_FALLBACK=["gemini-3.8-flash","gemini-3.6-flash","gemini-3.5-flash-lite"];
const CLAUDE_FALLBACK=["claude-sonnet-5-5","claude-haiku-5-5"];
class AIError extends Error{constructor(kind,msg,raw){super(msg);this.kind=kind;this.raw=raw}}
function classify(status, j){
  const raw=j?.error?.message||("HTTP "+status), s=(j?.error?.status||j?.error?.type||"")+" "+raw;
  if(status===503||status===529||status===500||/UNAVAILABLE|overloaded|high demand|try again later/i.test(s)) return new AIError("busy","AI 服務目前使用人數過多",raw);
  if(status===429||/RESOURCE_EXHAUSTED|quota|rate.?limit/i.test(s)) return new AIError("quota","這個模型的免費額度已用完或請求太頻繁",raw);
  if(status===400&&/API key|API_KEY/i.test(s)||status===401||status===403) return new AIError("key","API 金鑰無效或沒有權限，請到「AI 辨識設定」檢查金鑰",raw);
  if(status===404||/not found|is not supported/i.test(s)) return new AIError("model","找不到這個模型",raw);
  return new AIError("other","AI 回傳錯誤："+raw,raw);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function geminiOnce(model,b64){
  let r; try{ r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":AI.key},
    body:JSON.stringify({contents:[{parts:[{text:aiPrompt()},{inline_data:{mime_type:"image/jpeg",data:b64}}]}],generationConfig:{responseMimeType:"application/json",temperature:0}})}); }
  catch(e){ throw new AIError("net","連不上 AI 服務，請確認手機網路",String(e)); }
  const j=await r.json().catch(()=>null); if(!r.ok) throw classify(r.status,j);
  return parseJSON((j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join(""));
}
async function claudeOnce(model,b64){
  let r; try{ r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":AI.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model,max_tokens:1024,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:aiPrompt()}]}]})}); }
  catch(e){ throw new AIError("net","連不上 AI 服務，請確認手機網路",String(e)); }
  const j=await r.json().catch(()=>null); if(!r.ok) throw classify(r.status,j);
  return parseJSON(j.content.map(c=>c.text||"").join(""));
}
async function callAI(dataUrl, onStatus=()=>{}){
  const b64=dataUrl.split(",")[1];
  if(SAMPLE && !AI.key){
    const blob=new Blob([Uint8Array.from(atob(b64),c=>c.charCodeAt(0))],{type:"image/jpeg"});
    return SAMPLE.json(aiPrompt(),{images:[blob],modelTier:"default"});
  }
  if(!AI.key) throw new Error("尚未設定 AI 金鑰：請到頁面下方「AI 辨識設定」貼上金鑰");
  const first=AI.model||AI_DEFAULT_MODEL[AI.provider];
  const chain=[first,...(AI.provider==="claude"?CLAUDE_FALLBACK:GEMINI_FALLBACK).filter(m=>m!==first)];
  const once=AI.provider==="claude"?claudeOnce:geminiOnce;
  let last;
  for(let i=0;i<chain.length;i++){
    const m=chain[i];
    for(let attempt=0;attempt<2;attempt++){
      try{ const res=await once(m,b64); if(i>0) res._model=m; return res; }
      catch(e){
        last=e; if(!(e instanceof AIError)) throw e;
        if(e.kind==="busy"&&attempt===0){ onStatus(`${m} 忙碌中，3 秒後重試…`); await wait(3000); continue; }
        break;
      }
    }
    if(!["busy","quota","model"].includes(last.kind)) break;
    if(chain[i+1]) onStatus(`${last.message}，改用 ${chain[i+1]} 辨識中…`);
  }
  throw new Error(last.kind==="busy" ? "AI 服務目前使用人數過多，已重試並換過備用模型仍失敗。請過幾分鐘再按一次，或先手動輸入。"
                 : last.kind==="quota" ? "今天的免費額度都用完了（含備用模型），請明天再試，或改用其他金鑰。"
                 : last.message);
}
function applyScan(k, res){
  const d=S.dose[k]; const filled=[]; const put=(path,v)=>{ if(v==null||v==="") return; setPath(path,v); AI_FILLED.add(path); filled.push(path) };
  put(`dose.${k}.prod`, res.prod); put(`dose.${k}.cust`, res.cust); put(`dose.${k}.tons`, num(res.tons)==null?null:String(num(res.tons)));
  const adds=(res.adds||[]).filter(a=>a&&a.name);
  if(adds.length){ d.adds=[{},{},{},{}]; for(let j=0;j<4;j++){ AI_FILLED.delete(`dose.${k}.adds.${j}.name`); AI_FILLED.delete(`dose.${k}.adds.${j}.kg`); }
    adds.slice(0,4).forEach((a,j)=>{ put(`dose.${k}.adds.${j}.name`,String(a.name).trim()); put(`dose.${k}.adds.${j}.kg`, num(a.kg)==null?null:String(+(+a.kg).toFixed(3))); }); }
  const extra = adds.length>4 ? `；另有 ${adds.length-4} 項超過表格欄位（${adds.slice(4).map(a=>a.name).join("、")}）` : "";
  return {n:filled.length, extra};
}

  setPath(p,v); if(AI_FILLED.delete(p)) e.target.classList.remove("aifill");
  const m=p.match(/^fg\.(\d+)\.name$/);
  if(m && SET.fg[v]!=null){ setPath(`fg.${m[1]}.bin`,String(SET.fg[v])); const b=document.querySelector(`[data-in="fg.${m[1]}.bin"]`); if(b) b.value=SET.fg[v]; }
  touch();
  if(e.isComposing) return;
  if(e.target.tagName==="SELECT"||e.target.type==="date"||e.target.classList.contains("num")) render();
});
["date","t1","t2","maker","boss"].forEach(k=>$("#m-"+k).addEventListener("input",e=>{S[k]=e.target.value;touch();if(k==="date"){render();loadMonth()}}));
document.addEventListener("change",async e=>{
  const sec=e.target.dataset.photo; if(!sec) return;
  for(const f of e.target.files){ try{ const p=await toJpeg(f); S.photos.push({id:Math.random().toString(36).slice(2,9),sec,cap:secName(sec),...p}); }catch(err){flash("有一張照片無法讀取，請改用 JPG 或 PNG")} }

function secName(id){return {raw:"進廠原料",stock:"庫存原料",premix:"預混料",corn:"粗細玉米",cond:"調質溫度",dose0:"手投查核1",dose1:"手投查核2",fg:"成品",other:"其他缺失"}[id]||id}
function toJpeg(file,max=1280){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{
  const k=Math.min(1,max/Math.max(img.width,img.height));const w=Math.round(img.width*k),h=Math.round(img.height*k);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
  res({data:cv.toDataURL("image/jpeg",0.78),w,h})};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("這張照片的格式無法讀取（例如 HEIC），請改存成 JPG 或 PNG 再上傳"))};img.src=url;})}

let DB=null;

function recordOf(){ const {total,max}=scoreAll(); const {photos,_sample,...form}=S; return {date:S.date,month:S.date.slice(0,7),score:+total.toFixed(2),total:max,form:JSON.stringify(form),savedAt:new Date().toISOString()}; }
async function saveRecord(){
  if(S._sample){flash("這是範例資料，請先清空並填入今天的資料再存檔");return false}
  const rec=recordOf();
  const local=lsGet("qa-history")||{}; local[rec.date]=rec; lsSet("qa-history",local); lsSet("qa-maker",S.maker||"");
  if(DB){ try{ await DB.collection("records").doc(rec.date).set(rec); }catch(e){ flash("共用紀錄寫入失敗，已先存在這台裝置"); loadMonth(); return true; } }

async function monthRecords(ym){
  const map={}; const local=lsGet("qa-history")||{};
  Object.values(local).forEach(r=>{if(r.month===ym) map[r.date]=r});
  let src="這台裝置";
  if(DB){ try{ const q=await DB.collection("records").where("month","==",ym).get(); q.docs.forEach(d=>{const r=d.data(); map[r.date]=r}); src="共用紀錄"; }catch(e){} }

async function latestRecord(){
  let all=Object.values(lsGet("qa-history")||{});
  if(DB){ try{ const q=await DB.collection("records").orderBy("date","desc").limit(5).get(); all=all.concat(q.docs.map(d=>d.data())); }catch(e){} }
  all=all.filter(r=>r.date<S.date || r.date!==S.date).sort((a,b)=>b.date.localeCompare(a.date));
  const r=all[0]; return r? {...JSON.parse(r.form), date:r.date} : null;

let MONTH={map:{},src:""};
async function loadMonth(){

  const otherPh=S.photos.map((p,i)=>({p,i})).filter(x=>x.p.sec==="other").slice(0,2);
  let ct=dec.decode(files["[Content_Types].xml"]);
  if(otherPh.length){
    const a2=otherPh.map(({p,i},k)=>{const kk=Math.min(176/p.w,132/p.h);return picXml(k,`rId${k+1}`,p.cap,5,k?56:52,p.w*kk,p.h*kk)});
    files["xl/drawings/drawing2.xml"]=enc.encode(DRAW_HEAD+a2.join("")+"</xdr:wsDr>");
    files["xl/drawings/_rels/drawing2.xml.rels"]=enc.encode(REL_HEAD+otherPh.map(({i},k)=>`<Relationship Id="rId${k+1}" Type="${T_IMG}" Target="../media/image${i+1}.jpeg"/>`).join("")+"</Relationships>");
    const rp="xl/worksheets/_rels/sheet1.xml.rels"; let r1=dec.decode(files[rp]);
    r1=r1.replace("</Relationships>",`<Relationship Id="rIdPhoto" Type="${T_DRAW}" Target="/xl/drawings/drawing2.xml"/></Relationships>`); files[rp]=enc.encode(r1);
    const root=ws1.doc.documentElement; const dr=ws1.doc.createElementNS(NS,"drawing"); dr.setAttributeNS(RELNS,"r:id","rIdPhoto");
    const legacy=root.getElementsByTagNameNS(NS,"legacyDrawing")[0]; root.insertBefore(dr,legacy||null);
    ct=ct.replace("</Types>",`<Override PartName="/xl/drawings/drawing2.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>`);
  }
  ct=ct.replace("</Types>",`<Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/xl/worksheets/sheet4.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>`);
  files["[Content_Types].xml"]=enc.encode(ct);
  let wb=dec.decode(files["xl/workbook.xml"]);
  wb=wb.replace("</sheets>",`<sheet xmlns:r="${RELNS}" name="照片佐證" sheetId="4" r:id="rIdPhotos"/></sheets>`); files["xl/workbook.xml"]=enc.encode(wb);
  let wr=dec.decode(files["xl/_rels/workbook.xml.rels"]);
  wr=wr.replace("</Relationships>",`<Relationship Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="/xl/worksheets/sheet4.xml" Id="rIdPhotos"/></Relationships>`); files["xl/_rels/workbook.xml.rels"]=enc.encode(wr);
}
window.__buildXlsx=buildXlsx;

$("#btn-submit").onclick=async()=>{ if(await saveRecord()) flash(`已存檔 ${rocDate(S.date)}，得分 ${fmt(scoreAll().total)}`); };
$("#btn-export").onclick=async()=>{
  const btn=$("#btn-export"); btn.disabled=true; btn.textContent="產生中…";
  try{
    if(!S._sample) await saveRecord();
    const blob=await buildXlsx(); const [y,m,d]=S.date.split("-"); const name=`線上品保查核表${+y-1911}${m}${d}.xlsx`;
    let dl=null; try{ if(window.claude?.use) dl=await window.claude.use("downloads"); }catch(e){}
    if(dl){ try{ await dl.save({filename:name,data:blob}); flash("Excel 已輸出"); }catch(e){ flash(e?.code==="declined"?"已取消下載":"這個畫面無法下載檔案，請改用電腦開啟"); } }
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); flash("Excel 已輸出"); }
  }catch(e){ console.error(e); flash("輸出失敗："+(e.message||e)); }
  btn.disabled=false; btn.textContent="輸出 Excel";
};

refreshLists(); refreshAI(); render(); initDB(); initSample();
